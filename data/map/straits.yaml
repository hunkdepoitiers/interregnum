# Extra land-to-land adjacencies across water. Armies may cross these; everywhere else needs ships (not in v1).
- [constantinople, nicomedia]   # Bosporus
- [gallipoli, troad]            # Dardanelles
- [messina, reggio]             # Strait of Messina
- [jerez, ceuta]                # Strait of Gibraltar
- [roskilde, scania]            # Øresund
- [caffa, zichia]               # Kerch Strait
- [otranto, valona]             # Strait of Otranto
