# Hand-drawn terrain regions for tools/classify_terrain.py: land provinces whose centre lies inside an outline get
# that terrain, overriding the rules from elevation and latitude. Later entries win over earlier ones; hills and
# highlands from elevation still win inside forest, jungle and steppe outlines (a forested ridge stays hills).
# terrain: farmlands | plains | hills | highlands | forest | jungle | marsh | steppe | desert | tundra
# Outlines are [lat, lon] and may run over sea and other land freely.

