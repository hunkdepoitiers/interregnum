# Stats: every number the game computes from modifiers (src/sim/modifiers.ts). Values are in the stat's own unit
# (percent stats in percent); the build turns them into fixed-point hundredths.
# scope: province | realm. format: number | integer | percent | gold. A realm's modifiers also reach the province
# stats of every province it owns.
# Values are tuned for play (data/content/economy.yaml uses them): GUESS.

province:
  - key: development
    label: Development
    description: How built-up and populous the province is. Drives taxes, levies and supply.
    base: 5
    min: 0
    max: 100
    format: number
  - key: tax_efficiency
    label: Tax efficiency
    description: Share of the province's taxable wealth that reaches the treasury.
    base: 50
    min: 0
    max: 100
    format: percent
  - key: supply_limit
    label: Supply limit
    description: Thousands of soldiers the province can feed before armies start to starve.
    base: 5
    min: 1
    max: 50
    format: integer
  - key: unrest
    label: Unrest
    description: How close the people are to revolt. Above 10, rebels may rise.
    base: 0
    min: 0
    max: 100
    format: number
  - key: trade_efficiency
    label: Trade efficiency
    description: Share of the province's trade value its owner collects in tolls and dues.
    base: 30
    min: 0
    max: 100
    format: percent
  - key: production
    label: Production
    description: How much the province's people make of its trade good, against the usual.
    base: 100
    min: 0
    max: 300
    format: percent

realm:
  - key: legitimacy
    label: Legitimacy
    description: How rightful the ruler's claim to the throne is held to be. Affects vassal opinion and levies.
    base: 60
    min: 0
    max: 100
    format: number
  - key: levy_size
    label: Levy size
    description: Share of able-bodied men the realm can call up in war.
    base: 10
    min: 0
    max: 50
    format: percent
  - key: war_exhaustion
    label: War exhaustion
    description: How tired of war the realm's people are. Raises unrest and lowers taxes.
    base: 0
    min: 0
    max: 20
    format: number
  - key: tax_rate
    label: Tax rate
    description: Share of its subjects' wealth the realm asks in taxes. Set by the tax law.
    base: 20
    min: 0
    max: 60
    format: percent
  - key: tithe_share
    label: Tithe share
    description: Share of the church's tithe that reaches the treasury rather than the clergy.
    base: 10
    min: 0
    max: 100
    format: percent
