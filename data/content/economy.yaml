# The economy (M4). Money is in ducats (the build stores hundredths). Read by tools/build-data.ts (economy-lib).
# Every month each province's people produce wealth; the owner's tax law and the province's tax efficiency decide how
# much reaches the treasury, the church takes its tithe and the crown keeps its share of that, and the province's
# trade good adds trade income. Court, administration and the household troops cost money every month.
# All numbers are tuned for play, not taken from sources: GUESS.

# Wealth one person makes in a month, by stratum (ducats).
wealth_per_head:
  peasants: 0.008
  burghers: 0.04
  nobles: 0
  clergy: 0
  nomads: 0.003
# Wealth is multiplied by (base + per_point × development).
development_factor: { base: 0.6, per_point: 0.04 }
# Share of wealth the church takes as tithe (%); the realm's tithe_share stat says how much of it the crown gets.
tithe: 10
# Trade value of a province per month: good price × thousands of people × this × production %.
trade_per_thousand: 0.5
# Share of a vassal's gross income it owes its overlord (%).
vassal_dues: 15
# Monthly court costs by realm rank.
court: { empire: 400, kingdom: 200, duchy: 60, county: 15 }
administration_per_province: 4
# Household troops and garrisons, per thousand people, scaled by levy size / 10 %.
retinue_per_thousand: 0.6
# Monthly population growth (%), lowered by unrest: growth × (1 − unrest / 20).
growth: 0.08
# A realm starts with this many months of its net income in the treasury.
start_treasury_months: 6
# Rulers spend what they hold on their households, feasts, gifts and display: this share (%) of a positive
# treasury goes every month.
largesse: 2

# Entrepôts whose trade far outweighs their own people: [place, ducats of trade value a month], added to the
# province's trade value (its owner collects it by trade efficiency). place = a town key or [lat, lon].
trade_centres:
  - [venice, 30000]
  - [genoa, 25000]
  - [bruges, 12000]
  - [florence, 10000]
  - [pisa, 4000]
  - [barcelona, 6000]
  - [seville, 4000]
  - [london, 5000]
  - [paris, 4000]
  - [lubeck, 6000]
  - [novgorod, 5000]
  - [constantinople, 15000]
  - [caffa, 8000]
  - [tana, 4000]
  - [trebizond, 5000]
  - [famagusta, 6000]
  - [acre, 2000]
  - [alexandria, 25000]
  - [cairo, 10000]
  - [damascus, 6000]
  - [baghdad, 4000]
  - [tabriz, 10000]
  - [sarai, 6000]
  - [[27.1, 56.3], 8000]     # Hormuz
  - [[12.8, 45.0], 8000]     # Aden
  - [[39.65, 66.96], 6000]   # Samarkand
  - [[22.3, 72.6], 8000]     # Cambay
  - [[11.25, 75.78], 8000]   # Calicut
  - [[28.61, 77.21], 6000]   # Delhi
  - [[24.88, 118.6], 20000]  # Quanzhou
  - [[30.25, 120.17], 15000] # Hangzhou
  - [[23.13, 113.26], 8000]  # Guangzhou
  - [[-8.96, 39.51], 5000]   # Kilwa
  - [[16.77, -3.0], 4000]    # Timbuktu

laws:
  tax:
    - { key: low, name: Light taxes, description: The crown asks little of its subjects., modifier: tax_law_low }
    - { key: normal, name: Customary taxes, description: Dues as they have always been paid. }
    - { key: high, name: Heavy taxes, description: Every hearth pays more. The people grumble., modifier: tax_law_high }
law_cooldown_days: 365

# A province can hold one of each. cost is paid when building starts; upkeep is monthly.
buildings:
  - { key: market, name: Market, cost: 250, days: 180, upkeep: 1, modifier: building_market, description: A chartered market draws merchants and their tolls. }
  - { key: workshop, name: Workshops, cost: 300, days: 240, upkeep: 2, modifier: building_workshop, description: Weavers' and smiths' workshops raise what the province makes. }
  - { key: mill, name: Mills, cost: 180, days: 150, upkeep: 1, modifier: building_mill, description: Water mills grind grain and full cloth. }
  - { key: granary, name: Granary, cost: 150, days: 120, upkeep: 1, modifier: building_granary, description: Stores against lean years and passing armies. }
  - { key: church, name: Church, cost: 200, days: 200, upkeep: 1, modifier: building_church, description: A stone church calms the people and draws pilgrims. }

# Banking houses. capital is what they can lend; rate is their yearly base interest (%); risk (0-100) is how far
# below a good credit rating they will still lend. Local moneylenders lend to anyone, little and dear.
banks:
  - { key: bardi, name: The Bardi of Florence, seat: florence, capital: 1000000, rate: 7, risk: 55 }
  - { key: peruzzi, name: The Peruzzi of Florence, seat: florence, capital: 700000, rate: 8, risk: 60 }
  - { key: acciaiuoli, name: The Acciaiuoli of Florence, seat: florence, capital: 400000, rate: 8, risk: 50 }
  - { key: scali, name: The Scali of Florence, seat: florence, capital: 250000, rate: 9, risk: 65 }
  - { key: spinola, name: The Spinola of Genoa, seat: genoa, capital: 350000, rate: 9, risk: 50 }
  - { key: soranzo, name: The Soranzo of Venice, seat: venice, capital: 350000, rate: 8, risk: 45 }
  - { key: cahorsins, name: The Cahorsin moneylenders, seat: cahors, capital: 150000, rate: 14, risk: 75 }
  - { key: karimi, name: The Karimi merchants, seat: cairo, capital: 500000, rate: 10, risk: 50 }
  - { key: moneylenders, name: Local moneylenders, capital: 60000, rate: 25, risk: 100, local: true }

# Credit rating (0-100): base, plus a point per this many ducats of yearly net income, minus points per unit of
# debt-to-yearly-income, minus points per default in the last default_memory_days.
credit:
  base: 55
  income_per_point: 2000
  income_cap: 25
  debt_ratio_penalty: 30
  default_penalty: 35
  default_memory_days: 7300
  # A bank lends at most (rating / 50) × yearly gross income, less the realm's debts; interest rises by
  # (100 − rating) / rate_spread points.
  rate_spread: 5
  terms: [12, 24, 36, 60]
