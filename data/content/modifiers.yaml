# Modifiers: named bundles of effects on stats (data/content/stats.yaml). Put on a province or a realm by the
# scenario, events, laws, buildings or the debug console. effects: { stat, add } adds in the stat's unit;
# { stat, pct } multiplies by (1 + pct/100). stacking: replace (default; adding it again refreshes it) | stack.
# days: lasts that long, else until removed. A realm modifier with province-stat effects reaches all its provinces.
# Values are tuned for play: GUESS.

- key: capital
  label: Capital
  description: The seat of the realm's government.
  effects:
    - { stat: development, add: 5 }
    - { stat: tax_efficiency, add: 10 }
    - { stat: supply_limit, add: 2 }

- key: regency
  label: Regency
  description: The ruler is a child; a regent governs in his name.
  effects:
    - { stat: legitimacy, add: -15 }
    - { stat: levy_size, add: -2 }

- key: papal_vacancy
  label: Vacant See
  description: No pope has been elected since Clement V died in April 1314.
  effects:
    - { stat: legitimacy, add: -20 }

- key: disputed_election
  label: Disputed Election
  description: Louis of Bavaria and Frederick of Austria were both elected King of the Romans in October 1314.
  effects:
    - { stat: legitimacy, add: -10 }

- key: bannockburn_victory
  label: Victor of Bannockburn
  description: Robert Bruce routed the English army in June 1314.
  days: 1825
  effects:
    - { stat: legitimacy, add: 10 }
    - { stat: levy_size, add: 2 }

- key: bannockburn_defeat
  label: Defeat at Bannockburn
  description: Edward II's army was routed by the Scots in June 1314.
  days: 1825
  effects:
    - { stat: legitimacy, add: -10 }
    - { stat: war_exhaustion, add: 3 }

- key: strong_crown
  label: Strong Crown
  description: Royal officials reach into every province of the realm.
  effects:
    - { stat: tax_efficiency, add: 5 }
    - { stat: legitimacy, add: 5 }

- key: famine
  label: Famine
  description: The harvest has failed.
  days: 365
  effects:
    - { stat: tax_efficiency, add: -20 }
    - { stat: unrest, add: 10 }
    - { stat: supply_limit, pct: -40 }

- key: devastation
  label: Devastated
  description: Armies have burned and plundered the land.
  days: 730
  effects:
    - { stat: development, add: -2 }
    - { stat: supply_limit, add: -2 }
    - { stat: unrest, add: 5 }

- key: prosperity
  label: Prosperity
  description: Years of peace and good harvests.
  stacking: stack
  days: 1825
  effects:
    - { stat: development, pct: 10 }
    - { stat: tax_efficiency, add: 5 }

# ---------- Government
- key: church_state
  label: Church State
  description: The tithes of the realm flow to its own treasury.
  effects:
    - { stat: tithe_share, add: 90 }

- key: merchant_government
  label: Merchant Government
  description: The great families rule through trade, and tax land lightly.
  effects:
    - { stat: trade_efficiency, add: 15 }
    - { stat: tax_rate, add: -5 }

# ---------- Tax law
- key: tax_law_low
  label: Light Taxes
  description: The crown asks little of its subjects.
  effects:
    - { stat: tax_rate, add: -8 }
    - { stat: unrest, add: -1 }

- key: tax_law_high
  label: Heavy Taxes
  description: Every hearth pays more, and the people grumble.
  effects:
    - { stat: tax_rate, add: 10 }
    - { stat: unrest, add: 3 }

# ---------- Buildings
- key: building_market
  label: Market
  description: A chartered market draws merchants and their tolls.
  effects:
    - { stat: trade_efficiency, add: 15 }
    - { stat: development, add: 1 }

- key: building_workshop
  label: Workshops
  description: Weavers' and smiths' workshops raise what the province makes.
  effects:
    - { stat: production, add: 20 }

- key: building_mill
  label: Mills
  description: Water mills grind grain and full cloth.
  effects:
    - { stat: production, add: 10 }
    - { stat: development, add: 0.5 }

- key: building_granary
  label: Granary
  description: Stores against lean years and passing armies.
  effects:
    - { stat: supply_limit, add: 2 }

- key: building_church
  label: Church
  description: A stone church calms the people.
  effects:
    - { stat: unrest, add: -2 }
    - { stat: development, add: 0.5 }

# ---------- Debt
- key: defaulted
  label: Defaulted on Debts
  description: The crown would not pay what it owed. Lenders and subjects remember.
  days: 3650
  effects:
    - { stat: legitimacy, add: -15 }
    - { stat: tax_efficiency, add: -5 }

- key: revenues_seized
  label: Revenues Seized
  description: A lender's agents collect this province's dues against an unpaid loan.
  days: 1825
  effects:
    - { stat: tax_efficiency, add: -50 }

- key: revenues_pledged
  label: Revenues Pledged
  description: The province's dues stand surety for a loan.
  effects:
    - { stat: tax_efficiency, add: -5 }

- key: empty_treasury
  label: Empty Treasury
  description: The treasury is in debt; officials and soldiers go unpaid.
  days: 31
  effects:
    - { stat: legitimacy, add: -5 }
    - { stat: unrest, add: 2 }
    - { stat: tax_efficiency, add: -10 }

