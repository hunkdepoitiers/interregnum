# Deeds a ruler may do. cost_months: months of the realm's gross income (at least `min_cost` ducats); income_months:
# months of income gained; cooldown in days.
deeds:
  small_alms: { name: Give alms, cost: 100, piety: 5, cooldown: 30, description: Bread and coin for the poor at the gates. }
  great_alms: { name: Feed the poor of the realm, cost_months: 1, min_cost: 300, piety: 30, cooldown: 365, modifier: almsgiving, description: A great distribution of grain and silver in every town. }
  tournament: { name: Hold a tournament, cost_months: 1, min_cost: 400, prestige: 40, cooldown: 1095, modifier: tournament, description: Knights from far and wide joust for honour before the court. }
  pilgrimage: { name: Go on pilgrimage, cost: 400, piety: 60, prestige: 15, days: 240, modifier: on_pilgrimage, description: The ruler travels to a holy site of the faith and leaves the realm to the council. }
  seize_church_lands: { name: Seize church lands, income_months: 4, piety: -120, prestige: -10, cooldown: 1825, description: Take the abbeys' manors for the crown. The treasury fills; the clergy will not forget. }
  absolution: { name: Seek absolution, cost_months: 3, min_cost: 500, piety: 10, description: Make peace with the Holy See, with gifts to match the offence. }
# A pilgrim's road is dangerous: extra monthly chance of death (basis points) while away.
pilgrimage_risk: 80

# What happens to a realm's standing without anyone choosing it.
events:
  default: { prestige: -60 }
  empty_treasury: { prestige: -5 }
  # A new house keeps this share (%) of the old house's prestige and piety.
  dynasty_change_keep: 40

# Catholic rulers with piety below `below` may be excommunicated by a sitting pope (monthly chance in basis points).
excommunication: { faith: catholic, below: 0, chance: 300, prestige: -40, modifier: excommunicated, vacancy: papal_vacancy }

# Finishing a religious building raises the builder's standing.
buildings:
  church: { piety: 15 }
  cathedral: { piety: 60, prestige: 40 }
