# Trade goods: what each land province produces. Read by tools/build-data.ts (tools/goods-lib.ts).
# rules: the first rule that matches a province decides. A rule matches on any of: terrain (list), region (list of
# boxes [south, west, north, east]), lat_above / lat_below, coastal; `share` makes it match only that fraction of
# the provinces it would otherwise take (chosen by province key, so it is stable between builds).
# places: [good, place] overrides for famous producers; place = [lat, lon] or a town key from seeds.yaml.
# price: ducats per unit of trade (data/content/economy.yaml says how much a province trades). Distribution and
# prices are rough: GUESS.

