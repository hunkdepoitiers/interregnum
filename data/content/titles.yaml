hegemonies:
  - key: h_mongol_empire
    name: Mongol Empire
    de_jure: true
    description: Chinggis Khan's empire, now four khanates that still name the Yuan emperor their Great Khan.
    empires: [e_mongolia, e_tartaria, e_kazakh, e_ural, e_sibir, e_turan, e_moghulistan, e_persia, e_khorasan, e_tibet]
  - key: h_china
    name: China
    de_jure: true
    description: All under Heaven, the lands of the Han, ruled in 1314 by the Yuan.
    empires: [e_huabei, e_xibei, e_xinan, e_jiangnan, e_huguang, e_lingnan]
  - key: h_caliphate
    name: United Caliphate
    description: The whole house of Islam under one caliph. Formed by decision.
    empires: [e_arabia, e_mashriq, e_egypt, e_persia, e_khorasan, e_maghreb, e_turan, e_anatolia]
  - key: h_roman_empire
    name: Roman Empire
    description: East and West under one emperor again. Formed by decision.
    empires: [e_hre, e_byzantium, e_italy, e_anatolia]
  - key: h_hindustan
    name: Hindustan
    hindu_name: Bharat
    description: All of India under one throne, called Bharat under a Hindu ruler. Formed by decision.
    empires: [e_indus, e_rajputana, e_hindustan, e_bengal, e_deccan, e_dravida]
  - key: h_francia
    name: United Francia
    description: Charlemagne's realm restored. Formed by decision.
    empires: [e_francia, e_hre, e_italy]
  - key: h_bilad_al_sudan
    name: Bilad al-Sudan
    description: The land of the blacks, from the Atlantic to Lake Chad, under one mansa. Formed by decision.
    empires: [e_west_sudan, e_central_sudan]
