  - [[72, -26], [72, 45], [68, 62], [66, 80], [59, 90], [58.5, 107], [56, 120], [56, 145], [46, 148], [30, 148], [20, 132], [5, 130], [0, 142], [-11, 142], [-11, 105], [-6, 95], [4, 82], [5, 76], [22, 66], [12, 53], [11, 51.5], [2, 47], [-2, 42], [-9, 40.5], [-9, 38], [1, 34], [5, 25], [4, 8], [4, -8], [8, -18], [30, -20], [36, -18]]

