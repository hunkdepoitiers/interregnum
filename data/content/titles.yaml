# Upper title tiers (de jure). Counties and duchies are generated (data/map/titles.yaml, tools/build_titles.py).
# kingdoms: rough [lat, lon] outlines; a duchy belongs to the kingdom holding most of its provinces (later outlines
# paint over earlier ones; inside `fill`, gaps take the nearest kingdom). Duchies outside all that form a kingdom per
# modern country, keyed k_auto_<country code> (named in
# country_kingdoms, else after the country) until someone draws one. empires: lists of kingdoms. hegemonies: lists of
# empires; only those with `de_jure: true` are part of the de jure chain at the start, the rest are formed by
# decisions later (M10) and only record what they would unite. Outlines are rough: GUESS.

country_kingdoms:
  RUS: Sibir
  KAZ: the Kazakh Steppe
  CAN: Kanata
  USA: Turtle Island
  BRA: Pindorama
  AUS: the Southern Land
  CHN: Cathay

# Inside these outlines land no kingdom outline reaches goes to the nearest drawn kingdom (no automatic kingdoms).
