# Upper title tiers (de jure). Counties (one per province, also its barony) and duchies (about five provinces) are
# generated into data/map/titles.yaml by tools/build_titles.py.
# kingdoms: the size of a historical area (a few duchies), drawn as rough [lat, lon] outlines; a duchy belongs to the
# kingdom holding most of its provinces (later outlines paint over earlier ones; inside `fill`, gaps take the nearest
# kingdom). Duchies outside all that form a kingdom from their generated area, keyed k_<area>. France and Germany
# are kept whole as single great kingdoms.
# empires: historical regions, drawn as outlines; a kingdom belongs to the empire listed with it, else to the one
# whose outline holds most of its provinces (gaps inside `empire_fill` take the nearest).
# hegemonies: lists of empires; only those with `de_jure: true` are part of the de jure chain at the start, the rest
# are formed by decisions later (M10) and only record what they would unite. Outlines are rough: GUESS.

