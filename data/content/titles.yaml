# Upper title tiers (de jure). Every province is a county (and its own barony). Duchies, kingdoms and empires follow
# Crusader Kings III's de jure map, used only as a reference: every outline here is drawn by hand from geography.
# kingdoms: each lists its duchies as [key, name, outline, ...] rows of rough [lat, lon] points; a province takes the
# duchy whose outline holds its centre (later rows paint over earlier ones; inside `fill`, gaps take the nearest).
# Land outside `fill` (beyond CK3's map) keeps generated duchies (data/map/titles.yaml, tools/build_titles.py) and
# forms kingdoms from generated areas, keyed k_<area>. Kingdom and duchy names are bare: "France" is shown as
# "Kingdom of France". empires: list their kingdoms; the generated kingdoms join the empire whose outline holds most
# of their provinces (gaps inside `empire_fill` take the nearest). hegemonies: lists of empires; only those with
# `de_jure: true` are part of the de jure chain at the start, the rest are formed by decisions later (M10).
# Outlines are rough: GUESS.

