# Cultures and religions on 1 November 1314. Read by tools/build-data.ts the same way as the realms (data-lib):
# `area` outlines paint the land provinces whose centre they hold, later entries over earlier ones; `add` takes
# single places; every land province then gets the culture of the nearest painted land, so nothing is left blank.
# A province's religion is its culture's `religion`, unless a `religion_areas` outline paints another over it.
# Cultures follow medieval regional speech (French langues d'oïl and d'oc, German dialects, the Rus lands, Chinese
# regional cultures), not modern national borders. Outlines are hand-drawn and rough, especially outside Europe,
# the Middle East and India: GUESS. Colours are for the map modes.

