    name: Kingdom of Castile
    rank: kingdom
    government: feudal_monarchy
    color: "#d8a93b"
    capital: toledo
    provinces: [santiago, lugo, oviedo, leon, burgos, valladolid, toledo, cuenca, badajoz, seville, cordoba,
      jaen, jerez, calatrava, caceres, salamanca, zamora, segovia, siguenza, soria, logrono, santander, biscay]
  - key: portugal
