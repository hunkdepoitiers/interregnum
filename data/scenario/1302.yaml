# Political situation on 27 July 1302.
# Every land province belongs to exactly one realm, or is listed under `unclaimed`.
# `overlord` makes a realm a vassal/tributary; `scripted` realms are run by data timelines, not AI.
# `# GUESS` marks simplifications: merged minor lordships, uncertain 1302 holders, or approximate borders.
# Ranks: empire | kingdom | duchy | county. Governments: feudal_monarchy | merchant_republic | theocracy |
# holy_order | steppe_horde | iqta_sultanate | beylik.

unclaimed: [fezzan]   # Saharan oases outside any realm's control

# Controller differs from owner at game start (sieges and occupations in progress).
occupations:
  edinburgh: england  # English garrisons hold Lothian during the Wars of Independence

realms:
  # ---------------------------------------------------------------- Iberia
