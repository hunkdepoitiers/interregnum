      badajoz, merida, caceres, plasencia, seville, niebla, cordoba, jaen, baeza, jerez, calatrava, chinchilla,
      salamanca, zamora, segovia, avila, siguenza, soria, logrono, santander, biscay, alava, gipuzkoa]
