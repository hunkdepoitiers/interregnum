  # Iran, Iraq and the Gulf
  - [[42.5, 40], [42.5, 50], [38, 62], [30, 62], [25, 57.5], [27, 50], [30, 47], [33, 40], [37, 36]]
  # Indian subcontinent
  - [[37, 69], [36, 80], [29, 97], [21, 95], [5, 82], [5, 76], [22, 66], [30, 66]]
  # China, Korea and Japan (the Lao and hill country of Southeast Asia stays outside)
  - [[54, 96], [54, 142], [46, 147], [30, 132], [22, 122], [21, 108], [22.5, 101], [24, 97], [30, 97], [40, 95]]

# Modifiers in force on 1 November 1314: [realm, modifier] (data/content/modifiers.yaml). Capitals get `capital`.
modifiers:
  - [castile, regency]          # Alfonso XI is three
  - [lower_bavaria, regency]    # the young dukes are under Louis of Bavaria's guardianship
  - [papal_states, papal_vacancy]
  - [bavaria, disputed_election]
  - [habsburg, disputed_election]
  - [scotland, bannockburn_victory]
  - [england, bannockburn_defeat]
  - [france, strong_crown]      # Philip IV's officials

