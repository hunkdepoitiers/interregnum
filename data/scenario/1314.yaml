# Political situation on 1 November 1314: after Bannockburn (June) and the double election of Louis of Bavaria and
# Frederick of Austria (October), during the papal vacancy after Clement V, weeks before Philip IV of France dies.
# Borders follow Cyowari's maps "Europe ca. AD 1314" and "West and South Asia AD 1314" as a reference (outlines are
# drawn here by hand, not traced); areas outside those maps are rough.
#
# How ownership is worked out (tools/data-lib.ts), so it survives regenerating the province map:
# - `area`: outlines as [lat, lon] points. A land province belongs to the realm whose outline holds its centre;
#   realms later in this file paint over earlier ones, so big realms come first and enclaves after them.
#   Outlines may run out to sea or into wasteland freely: only land provinces are owned.
# - `add`: single provinces by place ([lat, lon] or a town key from data/map/seeds*.yaml); with the capital they
#   override every outline.
# - `fill` (top level): land inside these outlines that no realm reached goes to the nearest realm over land
#   (minor lordships and free cities merged into a neighbour). Land outside them stays unowned (tribal lands).
# `overlord` makes a realm a vassal or tributary; `scripted` realms run on data timelines, not AI.
# `# GUESS` marks simplifications: merged minor lordships, uncertain holders, or approximate borders.
# Ranks: empire | kingdom | duchy | county. Governments: feudal_monarchy | merchant_republic | theocracy |
# holy_order | steppe_horde | iqta_sultanate | beylik.

fill:
  # Europe, Anatolia and the Caucasus
