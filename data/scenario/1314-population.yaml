# Starting population and development, read by tools/build-data.ts (economy-lib). Every land province gets
# people = area (km²) × density for its terrain × the multiplier of the last region box that holds its centre;
# provinces built around a historical town (data/map/seeds.yaml) add town people as burghers. The aim is plausible
# totals for 1314 (Europe ~75 million, China ~80, India ~90, the world ~400): GUESS.

# People per km².
density:
  farmlands: 30
  plains: 12
  hills: 9
  highlands: 5
  forest: 4
  jungle: 3
  marsh: 3
  steppe: 1.5
  desert: 0.5
  tundra: 0.1

# [south, west, north, east, multiplier]; later boxes override earlier ones.
regions:
  - [-56, -180, 75, 180, 1.0]
  - [-40, -20, 37, 55, 0.35]      # Africa beyond the Mediterranean
  - [-56, -170, 75, -30, 0.25]    # the Americas
  - [13, -100, 23, -86, 1.0]      # Mesoamerica
  - [-20, -80, 0, -66, 0.9]       # the Andes
  - [50, 60, 75, 180, 0.1]        # Siberia
  - [-48, 110, -9, 180, 0.05]     # Australia and New Zealand
  - [36, -10, 60, 30, 1.0]        # Europe
  - [50, 2, 54, 7, 1.5]           # the Low Countries
  - [37, 7, 46, 18, 1.3]          # Italy
  - [24, 29, 32, 33, 4.0]         # the Nile valley and delta
  - [29, 42, 34, 48, 1.4]         # the Sawad of Iraq
  - [8, 68, 30, 92, 2.2]          # India
  - [20, 100, 42, 123, 1.6]       # China
  - [-9, 95, 20, 120, 0.8]        # Southeast Asia
  - [30, 128, 42, 146, 1.6]       # Japan
  - [33, 124, 43, 131, 1.2]       # Korea

# Every province: these shares of its people (%), the rest are peasants.
strata: { nobles: 1.5, clergy: 2, burghers: 3 }
# Steppe and desert provinces: this share of the non-noble, non-clergy people are nomads.
nomads: { terrains: [steppe, desert], share: 70 }
# A province holding a historical town adds this many burghers (more for capitals, which add capital_town).
town: 4000
capital_town: 15000

# Development = clamp(round(base + density × per_density) + town bonus, 1, max).
development: { base: 2, per_density: 0.15, town: 2, max: 30 }
